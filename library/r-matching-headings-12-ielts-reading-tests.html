<style>
:root{--bg:#f4f6fb;--panel:#ffffff;--text:#1d2433;--muted:#5f6b80;--line:#dde3ee;--accent:#1f4e9a;--accent2:#2f6fd6;--chip:#eef2f9;--ok:#16a34a;--bad:#dc2626;--okbg:#e7f7ec;--badbg:#fdecec;--hl:#fff3a3;--slot:#f2f6ff}
body.dark{--bg:#0f1420;--panel:#171e2d;--text:#e6ebf5;--muted:#9aa6bd;--line:#2a3449;--accent:#7fb0ff;--accent2:#5b93f0;--chip:#222c40;--okbg:#123222;--badbg:#3a1717;--hl:#6b5d10;--slot:#1c2742}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;color:var(--accent);font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.testsel{display:flex;align-items:center;gap:6px;flex:1;min-width:220px}
.testsel select{flex:1;max-width:460px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:14px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.result{background:var(--ok);border-color:var(--ok);color:#fff}
.timer{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-weight:700}
.timer span{min-width:52px;text-align:center;font-size:16px}
.timer span.low{color:var(--bad)}
.tg{display:inline-flex;align-items:center;gap:6px;background:#229ED9;color:#fff;text-decoration:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.tg svg{width:16px;height:16px}
.hlbtn{background:var(--hl);color:#000}
main{flex:1;display:flex;min-height:0}
.pane{overflow:auto;padding:18px 22px 90px}
#left{width:55%;background:var(--panel)}
#right{flex:1;background:var(--bg)}
#divider{width:7px;cursor:col-resize;background:var(--line);flex-shrink:0}
#divider:hover{background:var(--accent2)}
.ptitle{text-align:center;font-size:21px;margin:4px 0 6px}
.psub{text-align:center;font-style:italic;color:var(--muted);margin:0 0 14px;line-height:1.5}
.intro{font-style:italic;color:var(--muted);line-height:1.65;text-align:justify}
.slot{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding:6px 10px;border:1.5px dashed var(--line);border-radius:8px;background:var(--slot);font-size:13.5px;min-height:34px}
.slot .qn{background:var(--accent2);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px}
.slot .txt{color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--accent2)}
.slot.filled .txt{color:var(--text);font-weight:600}
.slot.ok{border-color:var(--ok);background:var(--okbg)}
.slot.bad{border-color:var(--bad);background:var(--badbg)}
.slot .fix{margin-left:auto;color:var(--ok);font-weight:700;font-size:12.5px}
.para{line-height:1.7;text-align:justify;margin:0 0 12px}
.para .L{font-weight:700;font-size:17px;margin-right:8px;color:var(--accent)}
mark{background:var(--hl);color:inherit;border-radius:2px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qhead{font-weight:700;font-size:16px;margin-bottom:6px}
.instr{font-style:italic;color:var(--muted);margin:3px 0;font-size:14px;line-height:1.45}
.headbox{border:1.5px solid var(--text);border-radius:6px;padding:12px 14px;margin:12px 0 4px}
.headbox h4{text-align:center;margin:0 0 8px}
.hrow{display:flex;gap:10px;padding:3px 0;font-size:14px;line-height:1.4}
.hrow b{min-width:34px}
.hrow.used{opacity:.45}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:none}
.qrow .num{background:var(--chip);border:1px solid var(--line);border-radius:6px;min-width:30px;text-align:center;font-weight:700;padding:3px 0}
.qrow .lab{min-width:96px;font-size:14px}
.qrow select{flex:1;min-width:180px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:13.5px}
.qrow.ok select{border-color:var(--ok);background:var(--okbg)}
.qrow.bad select{border-color:var(--bad);background:var(--badbg)}
.qrow .ans{width:100%;font-size:12.5px;color:var(--ok);font-weight:700;padding-left:40px}
.qrow.cur .num{background:var(--accent2);color:#fff}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:5}
footer .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.chip{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--text);font-weight:700;cursor:pointer}
.chip.done{background:#9aa3b2;color:#fff;border-color:#9aa3b2}
.chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.arrow{position:fixed;bottom:62px;width:42px;height:42px;border-radius:50%;border:none;background:var(--accent2);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:6}
#prevQ{right:66px}#nextQ{right:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.mbox{background:var(--panel);color:var(--text);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.score{display:flex;gap:12px;margin:12px 0}
.score div{flex:1;background:var(--chip);border-radius:10px;padding:12px;text-align:center}
.score b{display:block;font-size:26px;color:var(--accent)}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}
.rtab td,.rtab th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.rtab .y{color:var(--ok);font-weight:700}.rtab .n{color:var(--bad);font-weight:700}
.credit{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px}
@media (max-width:820px){main{flex-direction:column}#left{width:100%!important;height:55%}#divider{display:none}#right{height:45%}.pane{padding:14px 16px 90px}}

<script>
const TESTS=[{"title": "Born to Trade", "blocks": [["sub", "Long before our ancestors had any trappings of civilisation, they had a taste for material goods. Kate Douglas discovers where this ancient obsession has led us."], ["sec", "A"], ["p", "Humans are born to trade and we don't need shops or money to do it — the heart of commerce is an instinctive ability for what anthropologists call \"reciprocity\". This is an ability to exchange goods of equal worth, and it evolved as the brains of our ancient ancestors and societies became more complex, allowing individuals to keep a running tally of their interactions with others. Evidence from modern hunter-gatherers leaves little doubt that the exchange of food and favours is innate, as is the ability to keep track of the credits and debits that accrue as a result. Combine this skill for mental book-keeping with even the most basic material culture, and trade inevitably follows."], ["sec", "B"], ["p", "Once trade gets off the ground, the economic benefits quickly make it irresistible. But exchanging tools, food and other essentials of life in a barter economy is a far cry from the shopping mall. Modern consumerism extends beyond subsistence and utilitarianism to encompass everything from Gucci handbags and BMW convertibles to valuable paintings. Clearly, the worth of such goods is not inherent but resides in certain intangible qualities that we invest in them. When did humans start holding these goods in such high esteem?"], ["sec", "C"], ["p", "All the archaeological evidence for the flowering of consumer culture has up to now pointed to a date of around 40,000 years ago. That's when early modern humans started making increasingly intricate bone and stone tools, carving patterns into rocks and creating representational art such as carved figurines, jewellery and cave paintings. However, discoveries in Africa are pushing the origins of consumerism much further back into human prehistory."], ["p", "A few years ago, reports began to emerge of discoveries made at the Blombos Cave, a site of ancient human habitation in South Africa. Christopher Henshilwood and colleagues from the University of Bergen in Norway dated thousands of pieces of ochre from the cave, and many of them proved to be more than 100,000 years old — before the time that early humans moved out of Africa. Ochre, a coloured clay that comes in various shades from red to black, does not occur naturally around Blombos and must have been imported from quarries at least 30 kilometres away, either directly by Blombos residents or through trade. Although ochre can be used to dry and preserve (cure) animal hides, the researchers are convinced the Blombos ochre had a symbolic purpose. For a start, it is predominantly red — any of the other colours available would have done for curing — and the surfaces of the clay had been scraped in a way that indicates they were used to yield pigment for dyes."], ["sec", "D"], ["p", "An even more intriguing discovery from Blombos was of 41 beads dating from 76,000 years ago, found in clusters and made from the shells of a tiny mollusc. These cannot be natural deposits, argue the researchers, as each cluster contains shells of a similar size and colour with consistently placed holes. What's more, all the beads display a pattern of wear suggesting friction from rubbing against thread, clothes or other beads."], ["p", "The previous oldest find of beads in Africa dates back to just 45,000 years ago. And it seems the Blombos people's taste for beautiful items was not an isolated phenomenon. Jessica Thompson of Arizona State University in Tempe has described finding shell fragments from a site in Tanzania that she believes may represent debris from bead manufacture. They are at least 45,000 — and possibly 280,000 — years old. Although there is no evidence of how the ancient beads were used, their modern counterparts are often traded. So it looks as though our taste for jewellery and art is much older than we thought."], ["sec", "E"], ["p", "But why did we come to value these objects in the first place? In many animal species, individuals signal their genetic fitness by showing off with attention-grabbing adornment. Some researchers think that in humans, consumer products play a similar role. Archaeologist Aimee Plourde, from the University of California, also argues that even in egalitarian societies, some people are more successful than others. Among our ancestors, superior skills in areas such as hunting, crafts, environmental knowledge and contact with neighbouring groups would have brought respect — in other words, prestige."], ["p", "And because prestige brings social benefits, people would want to show off their talents. The best way to do this would be through demonstrating possession of material items that are hard to fake. 'A good hunter, for instance, could advertise his skills by wearing the tooth of an animal that is elusive or dangerous,' says Plourde. The benefits of prestige would also lead to competition to acquire it. As a result, the value and variety of prestige goods would spiral and there would be a parallel increase in the ranking of social systems."], ["p", "If Plourde is correct, prestige goods form a direct link between our innate drive for trade and the development of structured, hierarchical societies. They are arguably the first step on the road to modern civilisation, paving the way for agriculture and urbanisation. We may not be impressed by beads any more, but their modern equivalents have the same fascination. Nobody believes the guy who spends €670,000 on a Bugatti Veyron car does so because he needs to travel at 250 mph. We all know in today's consumer society he's buying an exclusive status symbol."]], "heads": {"i": "The desire to make expensive jewellery", "ii": "The clues that indicate ancient items were decorative", "iii": "Querying the changes in the value of traded items", "iv": "A natural human talent", "v": "How status can be gained from ownership of goods", "vi": "Recent finds alter theories about when consumerism started", "vii": "Changes in research methods"}, "ans": ["iv", "iii", "vi", "ii", "v"]}, {"title": "The economic effect of climate", "blocks": [["sub", "Latitude is crucial to a nation's strength, says Anjana Ahuja"], ["sec", "A"], ["p", "Dr William Masters was reading a book about mosquitoes when an idea struck him. 'There was this anecdote about the yellow fever epidemic that hit Philadelphia in 1793,' Masters recalls. 'This epidemic decimated the city until the first frost came.' The sub-zero temperatures froze out the insects, allowing Philadelphia to recover. If weather could be the key to a city's fortunes, Masters thought, then why not to historical fortunes of nations? And could frost lie at the heart of one of the most enduring economic mysteries of all — why are almost all the wealthy, industrialized nations to be found where the climate is cooler?"], ["sec", "B"], ["p", "After two years of research, he thinks that he has found a piece of the puzzle. Masters, an agricultural economist from Purdue University in Indiana, and Margaret McMillan at Tufts University, Boston, show that annual frosts are among the factors that distinguish rich nations from poor ones. Their study is published this month in the Journal of Economic Growth. The pair speculate that cold snaps have two main benefits — they freeze pests that would otherwise destroy crops, and also freeze organisms, such as those carried by mosquitoes, that carry disease. The result is agricultural abundance and a big workforce."], ["sec", "C"], ["p", "The academics took two sets of information. The first was average income for countries, the second was climate data provided by the University of East Anglia. They found a curious tally between the sets. Countries having five or more frosty days in the winter months are uniformly rich; those with fewer than five are impoverished. The authors speculate that the five-day figure is important; it could be the minimum time needed to kill pests in the soil. To illustrate this, Masters notes: 'Finland is a small country that is growing quickly, but Bolivia is a small country that isn't growing at all. Perhaps climate has something to do with that.'"], ["sec", "D"], ["p", "Other minds have applied themselves to the split between poor and rich nations, citing anthropological, climatic and zoological reasons for why temperate nations are the most affluent. Jared Diamond, from the University of California at Los Angeles, pointed out in his book Guns, Germs and Steel that Eurasia is broadly aligned east-west, while Africa and the Americas are aligned north-south. So in Europe crops could move quickly across latitudes because climates are similar. One of the first domesticated crops, einkorn wheat, extended quickly from the Middle East into Europe; it took twice as long for it to get from Mexico to what is now the eastern United States. This easy movement along similar latitudes in Eurasia would also have meant a faster dissemination of other technologies, such as the wheel and writing, Diamond speculates."], ["sec", "E"], ["p", "There are exceptions to the 'cold equals rich' argument. There are well-heeled tropical countries such as Singapore, a result of its superior trading position. Likewise, not all European countries are moneyed. Masters stresses that climate will never be the overriding factor — the wealth of nations is too complicated to be attributable to just one factor. Climate, he feels, somehow combines with other factors — such as the presence of institutions, including governments, and access to trading routes — to determine whether a country will do well."], ["sec", "F"], ["p", "In the past, Masters says, economists thought that institutions had the biggest effect on the economy, because they brought order to a country in the form of, for example, laws and property rights. With order, so the thinking went, came affluence. 'But there are some problems that even countries with institutions have not been able to get around,' he says. 'My feeling is that, as countries get richer, they get better institutions. And the accumulation of wealth and improvement in governing institutions are both helped by a favourable environment, including climate.'"], ["sec", "G"], ["p", "This does not mean, he insists, that tropical countries are beyond economic help and destined to remain penniless. Instead of aid being geared towards improving administrative systems, it should be spent on technology to improve agriculture and to combat disease. Masters cites one example: 'There are regions in India that have been provided with irrigation — agricultural productivity has gone up and there has been an improvement in health.' Supplying vaccines against tropical diseases and developing crop varieties that can grow in the tropics would break the poverty cycle."]], "heads": {"i": "Level of wealth affected by several other influences besides climate", "ii": "The failure of vaccination programmes", "iii": "The problems experienced by small countries", "iv": "The role of governments in creating wealth", "v": "The best use of financial assistance", "vi": "The inspiration for Masters's research", "vii": "The advantages of cold weather to people and agriculture", "viii": "Positive correlations between climate and economy", "ix": "Reflecting on the traditional view", "x": "Crop spread in Europe and other continents"}, "ans": ["vi", "vii", "viii", "x", "i", "ix", "v"]}, {"title": "Flood control in the USA", "blocks": [["sec", "A"], ["p", "Americans have always feared floods, and with good reason. Floods are the most common and costly of the large natural disturbances affecting the United States. Approximately 9 of every 10 presidential disaster declarations are associated with them and, after total insurance losses from a series of devastating floods between 1990 and 1997 reached nearly $34 billion, government policy changed. The USA has subsequently spent even more than that trying to control floods by building structures such as levees and dams to modify the ways rivers flow."], ["sec", "B"], ["p", "However, although we are well aware of the damage floods do, we have not, until recently, fully appreciated the many beneficial aspects of flooding. Floods are critical for maintaining and restoring many of the important services provided to humans by ecosystems. Among other things, regular flooding ensures high levels of diversity in the riverine environment by providing a critical habitat for fish, waterfowl, animals, insects, and plants. Floodwaters also replenish agricultural land with key nutrients vital to crop production, and transport the sediment that is necessary to maintain downstream delta and coastal land and prevent erosion. As our knowledge of floods has deepened, it has become apparent that floods present us with a paradox. On the one hand, we want to prevent them, because they threaten our lives and ways of life. On the other hand, we find ourselves searching for ways to allow or even reintroduce flooding, because it supports the biological infrastructure that makes valued aspects of our lives possible."], ["sec", "C"], ["p", "The focus of policy began to change dramatically in the wake of massive flooding in the upper Mississippi and lower Missouri river basins from June to August of 1993. Many of the flood defenses failed during this episode. In response, the President ordered a special committee to investigate causes, explore how human actions might have exacerbated the situation, and determine what the nation should do to prevent a repeat event. Known as the Galloway Report, the committee's findings and recommendations marked the first time that the crucial ecological protections provided by wetlands and upland forests were explicitly acknowledged. This included their ability to store water, slow its entry into the river system, and absorb excess nutrients. The committee pointed out that losing these protections through changes in land use significantly increases runoff from farmland with serious consequences for water quality. Above all, the report acknowledged that floods are recurring phenomena that must be accepted and anticipated."], ["sec", "D"], ["p", "A common theme in the findings from analyzing a range of flood episodes is the importance of connections between riverine ecosystems, their floodplains, and the broader landscapes through which they flow. It is worth noting that efforts to prevent rivers from reclaiming their floodplains rarely pay off in the long run. On the contrary, most of the flood costs over the past decade have been associated with damage to structures in those floodplains. We have also learned that building on floodplains harms wetlands by reducing their ability to hold water and retain nitrogen, phosphorus, and other contaminants. Floodplains are the sole safeguard the environment has against these and other harmful effects of floods. The aftermath of flooding caused by storm Alberto in Georgia in 1994 highlighted the important role they play in minimizing destruction. When floodwaters eroded agricultural fields, picking up soil particles contaminated with herbicides, pesticides, and fungicides, the large, forested floodplains in the area filtered out those particles. They never entered rivers to cause harm."], ["sec", "E"], ["p", "Fortunately, although the mechanics of re-establishing floodplains are daunting, it is not impossible; their ecosystems are resilient, as studies on recurrent floods in the lower Missouri River have shown. Annual spring floods have long been controlled in this portion of the river, which stretches from Sioux City, Iowa, to St. Louis, Missouri. As a result, it was almost totally disconnected from its floodplain and, by 1990, state or federal agencies had classified 16 fish species, 7 plant species, 6 insect species, 2 mussel species, 4 reptile species, 14 bird species, and 3 mammal species within the floodplain complex as endangered, threatened, or rare. But the situation began to change with the great Midwest floods of 1993, 1995, and 1996. Post-flood studies have demonstrated that plants, zooplankton, aquatic insects, fish, turtles, and other animals immediately exploited the reconnection with the floodplain."], ["sec", "F"], ["p", "Ensuring that the necessary changes in the landscape are actually made requires a good deal of thought, however. In particular, the fragmentation and lack of coordination that has characterized policy concerning floodplains in the United States must be addressed. Decisions on developments such as construction that could affect floodplains are made primarily at county and municipal levels, yet the current policy structure gives the federal government the most responsibility for floodplain management. It provides little incentive and few mechanisms for the county and municipal governments to help. Nor do individual states have much opportunity to become involved, even though they may be best situated to coordinate the diverse actions and decisions that are needed. In the end, all such policy decisions and the accompanying management actions must be based on people weighing up the costs and benefits of different spending priorities. In other words, they are political. Scientists alone will not, and should not, select which options are appropriate. Rather, their contribution will be to spell out the implications and the trade-offs of different policy options and management scenarios."]], "heads": {"i": "Official recognition of the importance of natural flood protection", "ii": "Understanding the positive side of flooding", "iii": "The consequences of man-made climate change on flooding", "iv": "The economic implications of flooding", "v": "Nature's rapid powers of recovery", "vi": "Bureaucratic obstacles to natural flood controls", "vii": "Science leads the way in flood prevention", "viii": "The only natural defence against flood damage"}, "ans": ["iv", "ii", "i", "viii", "v", "vi"]}, {"title": "Healthy buildings, productive people", "blocks": [["sub", "Indoor building can influence our thinking, behavior and health"], ["sec", "A"], ["p", "Have you felt tired at your desk lately? According to new research, some often overlooked environmental factors within buildings – the degree or type of ventilation, airborne contaminants, lighting and noise levels, for example – can play a surprisingly large role in how good or bad you feel, and even how well you think. It is estimated that we spend more than 90 percent of our time inside, but builders in general have paid little attention to the health aspects of indoor spaces, instead focusing on superficial design features and on meeting minimum environmental standards to keep costs down."], ["sec", "B"], ["p", "Researchers at Harvard University in the US looked at the effects of indoor air quality on workers' cognitive performance – important both for health and for companies' bottom lines, says Joseph Allen, assistant professor of environmental health and principal investigator of the studies. 'The true cost of running our buildings should take into account the health and productivity of people in those buildings,' Allen says. In fact, an analysis by the team showed that the cost of making alterations that could boost cognitive performance significantly was minuscule compared with the related increase in productivity – about $40 per person, per year, compared with a $6,500 increase in employee productivity."], ["sec", "C"], ["p", "The team's first study, published in Environmental Health Perspectives, was conducted at the Syracuse Center of Excellence, a US research organization devoted to studying and developing sustainability. The center houses a laboratory that allows researchers to test a wide range of indoor air quality factors using sophisticated ventilation. Each day, the indoor environment was controlled with a ventilation system which included small amounts of carbon dioxide and volatile organic compounds, or VOCs – the toxic by-products of office supplies commonly found in the workplace. The office workers were blinded to the conditions. For six days over two weeks, 24 office workers with administrative, technical, professional or managerial jobs came to the lab and performed their regular work under minimal supervision, as well as participating in an hour and a half of cognitive testing at the end of the day. The cognitive tasks used in the study had participants respond to online scenarios that mimic real-life situations, such as running a city as a mayor. The findings are remarkable for showing in a well-controlled study, that indoor air quality can significantly lower cognitive performance in buildings that would otherwise meet current building standards, notes environmental psychologist Craig Zimring, director of Georgia Tech University's SimTigrate Design Lab in the US. 'If these findings are replicated in other labs and in real-world work environments,' he says, 'they could lead to designs that provide much more outside air through mechanical ventilation or operable windows, for example' – in turn, promoting better health and performance."], ["sec", "D"], ["p", "In a second study, reported in Building and Environment, the Harvard-Syracuse team moved from the lab to the real world. Using the same methodology, they compared test scores of 109 people working in 10 buildings – about 12 people per site – in two buildings in each of five cities. When the team examined the buildings for differences, they found that certified buildings had lower humidity levels and brighter light than the non-certified buildings. That said, the differences in humidity and lighting didn't entirely explain the differing cognitive function scores of people on the job. This has led researchers to believe that other factors, such as how someone feels about their working environment, may also play a part, notes Harvard research fellow Piers MacNaughton, who led the study."], ["sec", "E"], ["p", "A recently constructed building on the Washington University campus in St. Louis, US, is providing another opportunity to examine how green building design can affect health and behavior. Hillman Hall was designed with the highest environmental and energy standards available, as well as design elements intended to foster more collaboration and physical activity, says Amy Eyler, associate professor and assistant dean for public health at the Brown School at Washington University. The design includes easy access to stairways, plenty of natural light, generous spaces for collaboration, desks that allow people to sit or stand up, and inviting places to walk. Unlike traditional hallways designed as long corridors with private offices to either side, for example, these hallways include classrooms, offices and spaces to sit, so they are multi-use – 'you have many reasons to walk them,' says Eyler. To test how the building might affect people's behavior, Eyler conducted a pre-test before people moved in, and a post-test one year later. Her team collected data on the three main features the designers were attempting to foster: physical activity, collaboration and sustainable practices. Results showed that people were more likely to take part in spontaneous collaborations in the new space than in the older ones, and to be physically active."], ["sec", "F"], ["p", "Like other researchers in this growing field, Eyler sees multidisciplinary collaboration as the key to success. Administrators, public health faculty and architects worked together to create a building that captured the university's vision for a space that fosters collegial work and health for faculty, staff and students – a shared goal evidenced by the fact that the architecture firm that designed the building also funded part of the research. 'Complex projects like this one need teams of people with varied backgrounds and expertise in order to solve them,' Eyler says."]], "heads": {"i": "The effects of a new environmentally friendly building on the people who work there", "ii": "The ability of well-designed workplaces to attract the best staff", "iii": "The assessment of workplaces in several locations", "iv": "The low priority given to making buildings healthy for users", "v": "Achieving design efficiency by involving a range of specialists", "vi": "Workers were assessed outside of their usual workplace", "vii": "Workplace changes based on worker feedback", "viii": "The financial benefits of efficient workplaces"}, "ans": ["iv", "viii", "vi", "iii", "i", "v"]}, {"title": "Homo ergaster", "blocks": [["sec", "A"], ["p", "A huge debate rages about human origins, but the broad consensus among scientists is that all the different species of human (hominids) that have ever existed were descended from ape-like creatures that walked upright in Africa more than six million years ago. These creatures had many descendants, most of which became extinct, but the first creature we would recognise as human first appeared in Africa almost two million years ago. Homo ergaster, meaning 'working human', evolved during an accelerated period of global cooling and drying that cleared more and more tropical rainforest from Africa, and created desert in the northern half of the continent."], ["sec", "B"], ["p", "One of the best sources of information about Homo ergaster is a skeleton found in 1984 by Alan Walker and Kamoya Kimeu at Nariokotome in West Turkana, Kenya. The remains turned out to be those of a young boy, who was between 11 and 13 when he died. Around 1.5 million years ago, the boy's body sank into the marsh where he died, and became fossilised. His teeth show signs of a sizeable abscess where his milk teeth fell out, indicating that he may have died from blood poisoning. Nariokotome Boy, as he has been dubbed, was about 160 centimetres (5 feet 3 inches) tall, and would have stood at 185 centimetres (6 feet 1 inch) had he reached adulthood."], ["sec", "C"], ["p", "He was clearly a strong boy, with a body shape that was perfectly adapted to an active life in the sun. Human populations living on equatorial grasslands today, such as the Masai in Kenya, have the same tall, linear physique. This body shape creates a large surface area over which the body can cool itself more easily, preventing Nariokotome Boy from overheating under the blazing sun. This hominid was probably the first to regulate its temperature through sweating. For creatures that must remain active at midday in a sunny, dry habitat, sweating is the most effective mechanism for maintaining safe body and brain temperatures. Homo ergaster's body was probably smooth and largely hairless, since heat loss through sweating occurs most efficiently through naked skin. Its skin was almost certainly dark, to protect it from the sun's harmful rays."], ["sec", "D"], ["p", "Homo ergaster travelled long distances on foot, as it worked hard to scavenge enough meat to feed its body and brain. In order to increase the energy efficiency of muscles involved in upright walking, Homo ergaster developed a narrower pelvis. But its slim hips came at a price. Firstly, the narrowing of the pelvis caused the lower part of the rib cage to narrow. In order to prevent constriction of the lungs, the upper part of Homo ergaster's rib cage expanded, giving its chest a human barrel shape. Secondly, and more importantly, the narrowing of the pelvis constricted the female birth canal. This single anatomical change seems to have had profound consequences for human society."], ["sec", "E"], ["p", "As brains increased in size, mothers had to push increasingly big-brained infants through an already tight pelvis, and that caused problems. The eventual solution was a trade-off. While chimpanzees are born with their brains almost fully mature, humans are born with a comparatively immature brain. This makes human babies helpless and vulnerable during their first year of life as their brains make vital neural connections. As a result, human mothers need to be well nourished to keep up with the demands of their babies, making them increasingly reliant on the support of their male partner and other members of their group. Many experts regard this shift as the beginning of the nuclear family with its distinctively human pattern of sharing and cooperation between males and females."], ["sec", "F"], ["p", "Nariokotome Boy had a thick, bony ridge across his eyes. A pair of front teeth stuck out at an angle from a large, projecting mouth below a long, wide nose. His anatomy does not seem developed enough to have given him the control over his breathing needed for complex speech, so Homo ergaster probably communicated using hand movements supplemented by a limited range of sounds. The other relatively small teeth of Nariokotome Boy suggest that Homo ergaster relied more than his ancestors on stone tools for cutting up meat before eating. To begin with, Homo ergaster used primitive implements, which were little more than chipped rocks with sharp edges. But by around 1.6 million years ago, Homo ergaster developed symmetrical, heart-shaped handaxes, which gave the hominid greater control over the butchering of meat."], ["sec", "G"], ["p", "Shortly after Homo ergaster appeared 1.9 million years ago, humans began to leave Africa for the first time and move to other continents. Archaeological records show they spread over an area ranging from Turkey into Asia, although the population may not have been very large. This newfound desire to travel may have been dictated by an increasing reliance on meat for food. Carnivores generally need much larger home ranges than similar-sized herbivores, because carnivores have fewer total calories, in the form of animal prey, available to them per unit area of their territory."]], "heads": {"i": "Assumptions about language and nutrition", "ii": "A series of developments involving bone structure", "iii": "Conflicting theories about Homo ergaster's ancestry", "iv": "The earliest occurrence of a human-like species", "v": "The beginnings of human migration", "vi": "Evidence of conflict between populations", "vii": "Physical features adapted for climate", "viii": "The social behaviour linked to human reproductive features", "ix": "Technical advances in the analysis of human remains", "x": "The valuable discovery of a specimen"}, "ans": ["iv", "x", "vii", "ii", "viii", "i", "v"]}, {"title": "Public Art Programs: Research Update", "blocks": [["intro", "Researchers agree that art participation is an important leisure pursuit, with benefits not only to the individual, but also to the community. Art participation can be active, where people create or perform the art, or passive, as is the case when an audience views a performance or a person visits a gallery."], ["sec", "A"], ["p", "Researcher Howard Spector suggests that active art experiences benefit all age groups by providing individuals with the means to freely and creatively express themselves. Self-expression, in turn, promotes individuality, bolsters self-confidence and improves motivation and attitudes towards academic performance. Both active and passive art experiences can provide the benefits of discovery, stimulation and relaxation (Oliphant 2000). Furthermore, people's participation in art enhances their development and expands their thoughts about culture. In short, art can make individuals more socially conscious."], ["sec", "B"], ["p", "Communities committed to providing opportunities for experiencing art are considered more livable because they are attractive to businesses and industry and they offer a higher quality of life for residents (Riley 2002). Tourism is strongly linked to art — art activities are believed to stimulate tourism in a community, and vice versa. Art-related tourism generates tourists and revenue, attracts high-income consumers, extends the tourist season and is a 'green' form of the industry (Hughes 2000). Revitalization efforts have increased in many cities because of the strong presence of art opportunities. Art programs can be highly effective in reducing community problems related to delinquent behavior and truancy in youth (Spector 2000). The Philadelphia Department of Recreation, Mural Arts Program (MAP) is one such program. It began in the early 1980s when the city undertook to remove graffiti in the city while creating a positive, productive and creative outlet for adjudicated graffiti artists, as they used their talents to beautify public spaces through the creation of murals, instilling a sense of pride, excellence, diligence and civic responsibility."], ["sec", "C"], ["p", "In recognition of these and other benefits, communities are finding many ways to ensure that the public is provided with opportunities to experience art. Public art programs are one way. These programs are typically administered by government, which commissions or mandates works of art for display in public spaces. Public art works can include street furniture, decorations, paving and landmarks, and may take on many forms, including sculpture, decorative ironwork, mosaic flooring and murals. The primary purpose of public art is to bring art into everyday life, to energize public spaces and to arouse society's thinking and imagination."], ["sec", "D"], ["p", "Despite the significant benefits that art participation can offer to individuals and communities, only 35 percent of the American adult population visit museums or galleries at least once during the year, and only about 25 percent attend a live performance (Bradshaw 1998). Even fewer (14 percent) participate directly in photography, painting, drawing, sculpting, dance (other than ballet), creative writing or classical music. If art experiences are so beneficial, why aren't more people participating?"], ["p", "To help researchers shed light on this question, the RAND Corporation, a nonprofit institution that helps improve policy and decision-making through objective research and analysis, developed 'A Behavior Model of the Participant Decision', which can be used to investigate people's inclinations about participating in an art activity (Yoshitomi 2000). According to Yoshitomi, each person has a disposition related to his or her interest in engaging in an art activity; a person's disposition is based on sociodemographic characteristics, social or cultural identity, personality and previous experience. The RAND model clusters participants into three groups according to their disposition toward art participation: those disinclined to participate; those inclined to participate; and those currently participating."], ["sec", "E"], ["p", "The RAND findings reveal that the disinclined perceive themselves as being uncomfortable or unfamiliar with art. This disposition might occur among people who do not value art and who have not received art education, or who perceive themselves as unsophisticated or lacking skill to participate. The inclined are interested in participating, but may be constrained by particular barriers, such as cost, time, and proper attire. Current participants are those who are involved, and influence or encourage others to participate."], ["p", "Researchers suggest that a strong relationship exists between childhood and adult art participation rates. Individuals with a greater number of childhood art experiences are more likely to have higher rates of participation as adults. Although 90 percent of Americans believe art instruction is important for children and should be offered in schools, almost 40 percent of schools either offer no art instruction or have art instructors with no formal art training."], ["sec", "F"], ["p", "One recreation organization working to make sure children get exposed to art is the Boys and Girls Clubs of America, which offer two innovative programs: The National Photography Program and the National Fine Arts Exhibit. Both are designed to get children excited about art. The photography program promotes new art that is technologically produced, including video and computer graphics, but primarily focuses on photography. The program provides club members with the opportunity to achieve personal growth and receive artistic recognition through instruction in photography. Participants also display their work at local, regional and national photography contests. The second program is the Fine Arts Exhibit. This encourages artistic expression, creativity, cultural appreciation and the development of artistic skills through classes, special events, exhibits and competitions. It allows participants to explore a variety of mediums, including drawing, painting, print making, collage and sculpture."], ["p", "Because art experiences provide so many important benefits to individuals and communities, it is important for community programs to facilitate opportunities and provide encouragement to increase participation in a variety of programs."]], "heads": {"i": "Interpreting the research behind who is participating in art activities", "ii": "How sales of artwork have increased in many countries", "iii": "Two opportunities for getting kids involved in art activities", "iv": "How art can be made accessible to the public", "v": "Developing a model to explain the lack of participation in art", "vi": "The connection between art and media", "vii": "How involvement with art affects well-being and attitudes", "viii": "How art makes communities safer and more vital"}, "ans": ["vii", "viii", "iv", "v", "i", "iii"]}, {"title": "The Future of Food Packaging", "blocks": [["intro", "Ever worn a white shirt while opening a can of tomato soup? Or left the frozen-yogurt shop bummed out by the huge trash can full of landfill-bound plastic spoons and cups? Food packaging tops the list of things you don't think about but can mess with your day, like cheap zippers or demagnetized credit cards."], ["sec", "A"], ["p", "Food companies spend a lot of time thinking about packaging as a way to represent their brand and make consumers love their products. More than cosmetic details like labels or logos, a food's container can suggest playfulness, environmental consciousness, or high technology. Packaging provides consumers' first and last impressions of a product."], ["sec", "B"], ["p", "Fortunately for consumers, advances in food packaging technology promise to make food storage and preparation simpler. Consumers are growing ever more obsessed with sleek technology, reducing food waste, and minimizing health risks to themselves and the environment, and in response, food packaging is undergoing some interesting developments. Food-packaging designers are hard at work to make groceries environmentally friendly, compact, and functional."], ["sec", "C"], ["p", "Edible packaging has been proposed as one solution to consumers' environmental concerns because it leaves no waste. The fried chicken chain KFC, for example, is experimenting with an edible coffee-cup. Made from a hard cookie lined with heat-resistant white chocolate, the cup is KFC's attempt to reduce its landfill waste and satisfy customers who are concerned that businesses produce products that support food-system sustainability and innovation. Another company, Stonyfield Organic, introduced frozen yogurt 'pearls' using edible food wrappers. The skin has no flavor and can be rinsed and eaten with the yogurt (much like a grape), eliminating the need for plastic spoons or wrappers for those on the go. It seems that people still want a layer of sanitary protection, though, because the spherical yogurts are still sold in plastic bags."], ["p", "Similarly, a company called Loliware has sold gelatin-based edible drinking cups for two years, in flavors like Madagascar vanilla and tart cherry. And last year, the company introduced edible cupcake wrappers made from potato starch. Even with these new advances, one decade-old edible invention continues to see great success — the clear paper used to wrap Japanese Botan Rice Candy."], ["sec", "D"], ["p", "Another development has been nonstick packaging, which can eliminate the 3 to 15 percent of sauces left inside traditional bottles, like those last trails of ketchup and mayonnaise that won't come out no matter how hard you shake or squeeze. Liquiglide – which refers to both a company and the product it makes – is a permanently wet slippery surface that allows viscous matter to slide off easily. Liquiglide estimates that its coating could prevent 1 million tons of food waste each year. The coating is made from components approved by the US government, and, according to the company, does not affect the taste or smell of food. Another benefit of Liquiglide is that it prevents carbonated beverages from going flat."], ["sec", "E"], ["p", "New safety-enhancing packaging is now addressing the issue of food spoilage. It might seem this was solved long ago with the advent of the 'Sell-by date stamp', which was meant to warn customers of when the food would no longer be considered suitable for consumption. But after a Harvard report revealed that sell-by dates are often inaccurate because of variances in transportation and grocery store policies, and that they also contribute to America's food-waste problem, the stamps have lost credibility in the food industry. In response, scientists are working on food packaging – like plastic wrap – that is 'active and intelligent' with tiny embedded sensors to first detect and later prevent food from spoiling. This advancement in food packaging draws upon nanotechnology, which is dedicated to making electronic sensors tiny and inexpensive. Of course, one could also rely on what has saved humankind from food poisoning for millennia – the senses. If it smells bad, throw it away."], ["sec", "F"], ["p", "Another emerging technology is packaging that disappears. MonoSol, LLC creates food-grade water-soluble bags for pre-portioned oatmeal or rice. When boiled, the bag dissolves, leaving only the food, ready to eat. MonoSol, LLC is marketing this to professional kitchens as well as consumers, as a way to pre-measure meal ingredients and ensure consistency regardless of who cooks. Tomorrow Machine, a Swedish design firm, has plans for three disappearing packages: an oil bottle made from hardened sugar that cracks open like an egg; a fruit juice container made from seaweed that will wither at the same rate as its content; and a peelable beeswax package for rice or other dry goods."], ["sec", "G"], ["p", "Super-compressed packaging serves the increasing number of city dwellers who generally have tiny kitchens and no storage room. Additionally, many people living in urban areas walk home from grocery stores, and they need lighter and smaller packages. Tomorrow Machine is also working on a compressed tiny package that expands into a full-size bowl when hot water is added."]], "heads": {"i": "Packaging that allows consumers to use more of the product", "ii": "The many reasons for changes in packaging", "iii": "Packaging that includes utensils like spoons and forks", "iv": "Packaging that can be consumed with its contents", "v": "Packaging that doesn't take up a lot of space", "vi": "The history of food packaging", "vii": "Packaging that indicates when food is beginning to go rotten", "viii": "Packaging that can be reused", "ix": "Using packaging to communicate ideas and attract customers", "x": "Packaging that vanishes or decomposes quickly"}, "ans": ["ix", "ii", "iv", "i", "vii", "x", "v"]}, {"title": "Can a global database of fossils help us predict the future of biodiversity on Earth?", "blocks": [["intro", "The history of life on Earth includes five major extinction episodes, which have each destroyed at least three quarters of all species, followed by life's resurgence. Whether we are now living through a sixth episode is not certain as we don't have a clear picture of how life changes between extinction events, or what has happened in previous episodes. A new project aims to fill some of the gaps."], ["sec", "A"], ["p", "The Paleobiology Database aims to be an online collection of information about every fossil* ever dug up. Its organisers hope that by recording the history of biodiversity they will gain an insight into how environmental changes have shaped life on Earth in the past, and how they might do so in the future. However, some experts believe the project to be seriously flawed, claiming that the fossil record is riddled with holes and biases. Others point out that, even if all current fossil finds were catalogued, they would provide an incomplete inventory of life because we are far from discovering every fossilised species. The disagreement has opened up a debate about the value of trying to measure biodiversity. Advocates of the Paleobiology Database acknowledge that the fossil record will always be incomplete, but they see value in looking for global patterns that show relative changes in biodiversity, claiming that an estimate of the rate of extinctions in the past provides a benchmark for determining the relative gravity of the mass extinction that is currently underway."], ["sec", "B"], ["p", "To this end, scientists around the world regularly add information about fossil finds to the Paleobiology Database. Already the database has thrown up some surprising results. John Alroy and his colleagues from the National Centre for Ecological Analysis and Synthesis in Santa Barbara believe they have found evidence that biodiversity reached a plateau long ago, contrary to the received wisdom that species numbers have increased continuously between extinction events. This evidence suggests that only a certain number of species can live on Earth at one time, filling a prescribed number of niches. Once it is full, no more species can squeeze in, until extinctions free up new spaces. So the current extinction episode might lead to a rapid burst of evolution over the next few million years."], ["sec", "C"], ["p", "Alroy has also used the database to check species names. He suggests that irregularities in classification inflate the overall number of species in the fossil record by between 32 and 44 per cent. Single species often end up with several names, he says, due to misidentification, or poor communication between taxonomists in different countries. Repetition can distort diversity curves. 'If you have a really bad taxonomy in one short interval, it will look like a diversity spike – a big diversification followed by a big extinction – when all that has happened is a change in the quality of the names,' says Alroy."], ["sec", "D"], ["p", "The fossil record is undeniably patchy. Some places have been more thoroughly investigated than others. And certain types of creatures – those with hard parts that lived in oceans, for example – are more likely to leave a record behind, while others, like the jellyfish, will always remain a mystery. Alroy has tried to make allowances for this in his calculations. He estimates, for example, that only 41 percent of North American mammals that have ever lived are known from fossils, and he suspects that a similar proportion of fossils are missing from other groups such as fungi and insects."], ["sec", "E"], ["p", "Not everyone is impressed with this mathematic wizardry. Jonathon Adrain from the University of Iowa points out that it is easy to misinterpret statistics and says that mistakes have been known to create mass extinctions where none occurred. For example, changes in sea level or inconsistent sampling methods can mimic major changes in biodiversity. Adrain believes that fancy analytical techniques are no substitute for hard evidence, but he has also seen how unhelpful historical collections can be. He claims the answer is to get out and search for new data."], ["sec", "F"], ["p", "Other people argue that whatever the scale of the Paleobiology Database, simply counting and documenting past species will give little insight into the current diversity crisis. According to David Jablonsky from the University of Chicago, this approach fails to account for how species relate to each other and to the world around them. 'I'm not claiming that every single beetle in the Amazon forest is essential,' he says, 'but some may be crucial as pollinators or links in the food chain. It's all tied together.' This suggests that even if species are not yet disappearing at the same rate as they did in past extinctions, disrupting the balance of nature may endanger entire ecosystems."], ["sec", "G"], ["p", "A complete Paleobiology Database might allow scientists to compare today's extinctions to patterns in the past. But predictions about what will happen next depend on our knowledge of the species alive today, which is far from certain. Fewer than two million species have been identified, but most experts suspect the total falls between 10 and 20 million. If they had a database of all living species, ecologists could start to put the current biodiversity crisis in historical perspective. Although creating such a list would be a task to rival the Paleobiology Database, it is exactly what the San Francisco-based ALL Species Foundation hopes to achieve in the next 25 years."]], "heads": {"i": "Why some species are not on the database", "ii": "One group's unexpected findings", "iii": "Plans for a database of existing species", "iv": "The purpose of the fossil database", "v": "How publicity for the project is being created", "vi": "Why it is necessary to consider the role played by different species", "vii": "Inaccuracies caused by multiple entries for the same species", "viii": "Potential errors make it necessary to hunt for more real fossils"}, "ans": ["iv", "ii", "vii", "i", "viii", "vi", "iii"]}, {"title": "The fashion industry", "blocks": [["sec", "A"], ["p", "The fashion industry is a multibillion-dollar global enterprise devoted to the business of making and selling clothes. It encompasses all types of garments, from designer fashions to ordinary everyday clothing. Because data on the industry are typically reported for national economies, and expressed in terms of its many separate sectors, total figures for world production of textiles* and clothing are difficult to obtain. However, by any measure, the industry accounts for a significant share of world economic output."], ["sec", "B"], ["p", "The fashion industry is a product of the modern age. Prior to the mid-19th century, virtually all clothing was handmade for individuals, either as home production or on order from dressmakers and tailors. By the beginning of the 20th century, with the development of new technologies such as the sewing machine, the development of the factory system of production, and the growth of department stores and other retail outlets, clothing had increasingly come to be mass-produced in standard sizes, and sold at fixed prices. Although the fashion industry developed first in Europe, today it is highly globalised, with garments often designed in one country, manufactured in another, and sold in a third. For example, an American fashion company might source fabric in China and have the clothes manufactured in Vietnam, finished in Italy, and shipped to a warehouse in the United States for distribution to retail outlets internationally."], ["sec", "C"], ["p", "One of the first accomplishments of the Industrial Revolution in the 18th century was the partial automation of the spinning and weaving of wool, cotton, silk and other natural fibres. Today, these processes are highly automated and carried out by computer-controlled, high-speed machinery, and fabrics made from both natural fibres and synthetic fibres (such as nylon, acrylic, and polyester) are produced. A growing interest in sustainable fashion (or 'eco-fashion') has led to greater use of environmentally friendly fibres, such as hemp. In addition, high-tech synthetic fabrics offer such properties as moisture absorption, stain resistance, retention or dissipation of body heat, and protection against fire, weapons, cold, ultraviolet radiation, and other hazards. Fabrics are also produced with a wide range of visual effects through dyeing, weaving, printing, and other processes. Together with fashion forecasters, fabric manufacturers work well in advance of the clothing production cycle, to create fabrics with colours, textures, and other qualities that anticipate consumer demand."], ["sec", "D"], ["p", "Historically, very few fashion designers have become famous brands such as Coco Chanel or Calvin Klein, who have been responsible for prestigious high-fashion collections. These designers are influential in the fashion world, but, contrary to popular belief, they do not dictate new fashions; rather, they endeavour to design clothes that will meet consumer demand. The vast majority of designers work in anonymity for manufacturers, as part of design teams, adapting designs into marketable garments for average consumers. They draw inspiration from a wide range of sources, including film and television costumes, street clothing, and active sportswear."], ["p", "The fashion industry's traditional design methods, such as paper sketches and the draping of fabric on mannequins, have been supplemented or replaced by computer- assisted design techniques. These allow designers to rapidly make changes to a proposed design, and instantaneously share the proposed changes with colleagues – whether they are in the next room or on another continent."], ["sec", "E"], ["p", "An important stage in garment production is the translation of the clothing design into templates, in a range of sizes, for cutting the cloth. Because the proportions of the human body change with increases or decreases in weight, templates cannot simply be scaled up or down. Template making was traditionally a highly skilled profession. Today, despite innovations in computer programming, designs in larger sizes are difficult to adjust for every body shape. Whatever the size, the template – whether drawn on paper or programmed as a set of computer instructions – determines how fabric is cut into the pieces that will be joined to make a garment. For all but the most expensive clothing, fabric cutting is accomplished by computer-guided knives or high- intensity lasers that can cut many layers of fabric at once."], ["sec", "F"], ["p", "The next stage of production is the assembly process. Some companies use their own production facilities for some or all of the manufacturing process, but the majority rely on separately owned manufacturing firms or contractors to produce garments to their specifications. In the field of women's clothing, manufacturers typically produce several product lines a year, which they deliver to retailers on predetermined dates. Technological innovation, including the development of computer-guided machinery, has resulted in the automation of some stages of assembly. Nevertheless, the fundamental process of sewing remains labour-intensive. In the late 20th century, China emerged as the world’s largest producer of clothing because of its low labour costs and highly disciplined workforce."], ["p", "Assembled items then go through various processes collectively known as 'finishing'. These include the addition of decorative elements, fasteners, brand-name labels, and other labels (often legally required) specifying fibre content, laundry instructions, and country of manufacture. Finished items are then pressed and packed for shipment."], ["sec", "G"], ["p", "For much of the period following World War II, trade in textiles and garments was strictly regulated by purchasing countries, which imposed quotas and tariffs. Since the 1980s, these protectionist measures, which were intended (ultimately without success) to prevent textile and clothing production from moving from high-wage to low-wage countries, have gradually been abandoned. They have been replaced by a free-trade approach, under the regulatory control of global organisations. The advent of metal shipping containers and relatively inexpensive air freight have also made it possible for production to be closely tied to market conditions, even across globe-spanning distances."]], "heads": {"i": "How new clothing styles are created", "ii": "The rise of the fashion industry", "iii": "Joining the garment pieces together", "iv": "Producing materials with a range of features", "v": "The importance of the fashion industry", "vi": "Factors affecting international commerce", "vii": "The attractions of becoming a fashion model", "viii": "Making patterns for people with different figures"}, "ans": ["v", "ii", "iv", "i", "viii", "iii", "vi"]}, {"title": "Classical music over the centuries", "blocks": [["sec", "A"], ["p", "The production of any great art form, and classical music is no exception, does not usually occur in a society dominated by the basic material demands of food and shelter. Art and music have flourished in those periods of history, and those parts of society, in which the luxury of free time and material wealth has allowed such a culture to take precedence over more material matters. In the medieval European world, it was thus primarily in the closed communities of the church and monastery, and royal courts that music, literature and learning were able to flourish."], ["sec", "B"], ["p", "It was not until the 18th century that this situation changed to any great extent, and the rise of an economically independent middle class meant that concert going became a public activity for anyone who cared to buy a ticket. It is worth remembering that the idea of classical music widely accepted today did not exist until about 300 years ago. Performing music in concert halls to a paying audience, as something inherently pleasurable and significant, was pretty much unheard of until the 18th century, and not widely established until the 19th. The concert venue, the audience, and the idea of ‘masterpieces’ of classical music, were all effectively invented during the course of the 18th century – in London, Paris, Vienna, Berlin and other European cities where the arts in general were blossoming."], ["sec", "C"], ["p", "Today, music that was originally written for a concert venue may appear, out of its original context, in an advert or film. Conversely, music written specifically for films is sometimes performed live. But nothing has changed music over the last century more radically than the invention and dissemination of recording technologies. However, although Thomas Edison originally developed the phonograph in 1877, and wax cylinders were used as early as the 1880s for recording music, commercial recordings of music were not generally available to the majority until the 1920s. From the mid-1980s onwards, the vinyl disc gradually gave way to the new technology of the CD, but just a decade later, the digital MP3 file was already displacing the CD as the favoured way to store recorded music. Yet now, people have more music stored on their phones or computers – which they can call up with the touch of a finger – than would have been contained on all the metres of library shelves of a proud ‘record collector’ of the 20th century."], ["sec", "D"], ["p", "Before recording, music was a social event – it involved one or more people coming together to make music. The music lasted for as long as the musicians sang or played and then it was over. Therefore, the only music that was heard tended to be compositions by recent or living musicians, probably working in the locality; it was rare to hear music from a past generation, distant place or culture. Even when music became professionalized, people who wanted to listen to music went to a specific venue, at a specific time, to hear musicians create a one-off event."], ["sec", "E"], ["p", "These days, however, technology makes almost all the world’s music instantly and constantly available to anyone with access to simple and cheap gadgets designed for playing it. Music thus floats free of any specific occasion or venue. It is no longer restricted to a particular audience or group of musicians. For the first time, music (any music) can be an entirely personal affair. This is one of the reasons that the ‘classical’ label becomes harder to pin down. One of its distinctive aspects – a performance defined by concert halls and opera houses- is dissolved by digital recording formats. As a consequence all music, classical music included, can become any person’s soundtrack for activities such as commuting, exercising or shopping."], ["sec", "F"], ["p", "The ubiquity of music as recorded sound means that it’s very easy to overlook perhaps the most definitive aspect of the classical music tradition – the fact that it is a written or notated music. Though classical music may lack a precise definition today and mean quite different things to different people, at its heart is the idea of a music that has remained viable over the years because it was written down in some form. The origin of what music historians think of as classical music dates from the ninth century, when a system of musical notation was first developed. Before this time, singers in religious services in cathedrals or monasteries had to learn by heart a huge repertory of chants. The first attempts to notate music were intended to help them remember these. Over the next thousand years, notation became more complex, incorporating such aspects as rhythm and pitch, allowing composers to rework and refine their musical ideas. Put very simply, the history of classical music, in all its varied forms, is the history of a tradition that grew out of the possibilities of musical notation."]], "heads": {"i": "Music comes to be enjoyed in a large variety of situations", "ii": "More people gain access to live music", "iii": "A focus on survival limits the practice of classical music", "iv": "A clash of musical styles takes place", "v": "A range of scientific advances brings music to a wider audience", "vi": "Listening to music being limited to live performances", "vii": "How classical music has managed to survive for centuries"}, "ans": ["iii", "ii", "v", "vi", "i", "vii"]}, {"title": "Living dunes", "blocks": [["sub", "Things don't come much stranger than heaps of sand that can move and sing of their own accord. Sally Palmer investigates."], ["sec", "A"], ["p", "Armies of giant sand dunes are advancing across the world's deserts, engulfing anything that crosses their path. They are tens of metres tall and hundreds of metres long. Fortunately, they aren't going very fast. Even the smallest, speediest dunes only travel about 100 metres over the course of a year, while the bigger ones, which weigh something in the order of 10,000 tonnes, barely move one metre in that time. However, their insidious creep can have serious consequences if there is an oil installation or a railway line in their path."], ["sec", "B"], ["p", "About 47% of the world's land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert. Only around 20% of that is sand-covered, however, and over half of that is classified as 'linear' sand dunes. These form in a long curving wave, as a result of wind blowing strongly from several quarters, flipping them from side to side. Although linear dunes are static, sand blowing off them can cause problems for desert villages, burying crops and buildings."], ["sec", "C"], ["p", "Moving dunes make up just a small percentage of the rest, but they are of the most interest to scientists. They are known as 'barchans': heavy, crescent-shaped sand piles with a ridged crest and two elongated arms, one curving away to either side. 'Barchan dunes only tend to form where you have one-directional winds on the edge of sandy deserts near coastal areas,' says Giles Wiggs, a geomorphologist at Oxford University, who has been studying the formation and movement of sand dunes for more than a decade."], ["sec", "D"], ["p", "But even with strong winds, how can entire barchans move while retaining their form? That question was first answered in the mid-20th century by British explorer Ralph Alger Bagnold, and his answer hinges on the fact that dunes aren't solid, but granular. Bagnold figured out how barchan dunes are able to move grain by grain. Imagine a single grain of sand being blown up the back of a dune by the wind and deposited on the top. More grains follow the same pattern, until the accumulated weight of piled-up sand finally pushes the top down the dune face. The grain tumbles, then stops on the face until subsequent mini-avalanches bury it. Eventually, it reappears at the back of the dune, the whole thing creeps in the direction of the prevailing wind."], ["sec", "E"], ["p", "The relationship between the wind and barchan dunes is complex. As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve. 'Interestingly the dune can regulate its own shape, and maintain it as it moves,' says Dr Stephane Douady, a physicist at École Normale Supérieure (ENS) in France. 'Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.'"], ["sec", "F"], ["p", "Douady and his colleagues have also been studying an even odder phenomenon than moving dunes: some barchans actually sing. Local legends attributed the sounds to dangerous spirits which were trying to trap unwary travellers. Douady is more pragmatic. 'It's a strong booming noise with a low frequency,' he explains, making a noise like a foghorn to demonstrate. 'It can last for a long time — up to several minutes. It's a very loud sound and you don't understand where it's coming from when you first hear it.' There are about 50 dunes distributed across 35 deserts round the world that are known to sing. Douady says the sound is caused by the way sand avalanches down the faces of particular dunes. Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker. The synchronization causes the air to move in and out between the grains, creating a powerful sound wave."], ["sec", "G"], ["p", "What really surprised the scientists, however, was that they were able to take samples of the singing sand back to France and replicate the sound at ENS, proving that it's the sand, not the dune shape, well-rounded from years of striking each other, and that the variations in size affect the tone. Crucially, the grains are coated with a special veneer, which Douady calls 'desert glaze,' made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium. The team found that after a month or so, the veneer wore off and the grains lost their 'voice'. 'We managed to reproduce the desert glaze and then the grains started to sing again,' says Douady. 'We tried putting the coating onto different grains, but they weren't round enough and it didn't work. But some American colleagues made some artificial grains and managed to make them sing, after covering them in desert glaze.' Douady has now made recordings of dune-song from all over the world which is to made into a CD."]], "heads": {"i": "Moving rapidly across the desert", "ii": "Recreating the process in a laboratory", "iii": "Strange music created by human movement", "iv": "A potential threat to industry and communications", "v": "Dunes coming together and re-forming", "vi": "Needing a specific combination of conditions", "vii": "A continuous cycle", "viii": "The commonest type of dune", "ix": "Old superstitions demystified"}, "ans": ["iv", "viii", "vi", "vii", "v", "ix", "ii"]}, {"title": "Songs of ourselves", "blocks": [["sec", "A"], ["p", "Music is one of the human species's relatively few universal abilities. Without formal training, any individual, from Stone Age tribesmen to suburban teenagers, has the ability to recognize music and, in some fashion, to make it. Why this should be so is a mystery. After all, music isn't necessary for getting through the day, and if it aids in reproduction, it does so only in highly indirect ways. Language, by contrast, is also everywhere but for reasons that are more obvious. With language, you and the members of your tribe can organize a migration across Africa, build reed boats and cross the seas, and communicate at night even when you can't see each other. In all its technological extravagance, modern culture springs directly from the human talent for manipulating symbols and syntax. Scientists have always been intrigued by the connection between music and language. Yet over the years, words and melody have acquired a vastly different status in the lab and the seminar room. While language has long been considered essential to unlocking the mechanisms of human intelligence, music is generally treated as an evolutionary frippery, mere auditory cheesecake, as the Harvard cognitive scientist Steven Pinker puts it."], ["sec", "B"], ["p", "But thanks to a decade-long wave of neuroscience research, that tune is changing. A flurry of recent publications suggests that language and music may equally be able to tell us who we are and where we're from – not just emotionally, but biologically. And in an article in the August 6 issue of the journal Neuroscience, David Schwartz, Catherine Howe, and Dale Purves of Duke University argued that the sounds of music and the sounds of language are intricately connected. To grasp the originality of this idea, it's necessary to realize two things about how music has traditionally been understood. First, musicologists have emphasized that while each culture stamps a special identity onto its music, music itself has some universal qualities. For example, in virtually all cultures, the sound is divided into some or all of the 12 intervals that make up the chromatic scale – the scale represented by the keys on a piano. For centuries, observers have attributed this preference for certain combinations of tones to the mathematical properties of sound itself. Some 2,500 years ago, Pythagoras was the first to note a direct relationship between the harmoniousness of a tone combination and the physical dimensions of the object that produced it. For example, a plucked string will always play an octave lower than a similar string half its size and a fifth over a similar string two-thirds its length. This link between simple ratios and harmony has influenced music theory ever since."], ["sec", "C"], ["p", "This music-is-math idea is often accompanied by the notion that music, formally speaking, exists apart from the world in which it was created. Writing recently in The New York Review of Books, pianist and critic Charles Rosen discussed the long-standing notion that while painting and sculpture reproduced at least some aspects of the natural world and writing describes thoughts and feelings we are all familiar with, music is entirely abstracted from the world in which we live. Neither idea is right according to David Schwartz and his colleagues. Human musical preferences are fundamentally shaped not by elegant algorithms or ratios but by the messy sounds of real life and of speech in particular - which, in turn, is shaped by our evolutionary heritage. 'The explanation of music, like the explanation of any product of the mind, must be rooted in biology, not in numbers pulse,' says Schwartz."], ["p", "Schwartz, Howe, and Purves analyzed a vast selection of speech sounds from a variety of languages, to reveal the underlying patterns common to all utterances. In order to focus only on the raw sound, they discarded all theories about speech and meaning and sliced sentences into random bites. Using a database of over 100,000 brief segments of speech,
