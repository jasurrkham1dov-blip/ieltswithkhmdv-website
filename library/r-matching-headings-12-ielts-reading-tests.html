they noted which frequency had the greatest emphasis on each sound. They discovered that the resulting set of frequencies corresponded closely to the chromatic scale. In short, the building blocks of music are to be found in speech."], ["p", "Far from being abstract, music presents a strange analog to the patterns created by the sounds of speech. 'Music, like the visual arts, is rooted in our experience of the natural world,' says Schwartz. 'It emulates our sound environment in the way that visual arts emulate the visual environment.' In music we hear the echo of our basic sound-making instrument - the vocal tract. The explanation for human music is simpler still than Pythagoras's mathematical equations: We like the sounds that are specific, we like sounds that remind us of us, familiar to us. This brings up some chicken-or-egg evolutionary questions. It may be that music imitates speech directly, the researchers say, in which case it would seem that language evolved first. It's also conceivable that music came first, and language is, in effect, an imitation of song - that in everyday speech, we hit the musical notes we especially like. Alternately, it may be that music imitates the general products of the human sound-making system, which just happens to be mostly speech. 'We can't know this,' says Schwartz. 'What we do know is that they both come from the same system, and it is this that shapes our preferences.'"], ["sec", "D"], ["p", "Schwartz's study also casts light on the long-running question of whether animals understand and appreciate music. Despite the apparent abundance of 'music' in the natural world - birdsong, whale song, wolf howls, synchronized chimpanzees - previous studies have found that laboratory animals don't show a great affinity for the human variety of music making. Marc Hauser and Josh McDermott of Harvard argued in the July issue of Nature Neuroscience that animals don't create or perceive music the way we do. The fact that laboratory monkeys can show recognition of human tunes is evidence, they say, of shared general features of the auditory system, not any specific chimpanzee musical ability. As for birds, those most musical beasts, they generally recognize their own tunes and narrow repertoire but don't generate novel melodies like we do. There are no avian Mozarts."], ["p", "But what's been played to the animals, Schwartz notes, is human music. If animals evolve preferences for sound as we do - based upon the soundscape in which they live - then their 'music' would be fundamentally different from ours. In the same way that our scales derive from human utterances, a cat's idea of a good tune would derive from yowls and meows. To demonstrate that animals don't appreciate sounds the way we do, we'd need evidence that they don't respond to 'music' constructed from their own sound environment."], ["sec", "E"], ["p", "No matter how the connection between language and music is parsed, what is apparent is that our sense of music, even our love for it, is as deeply rooted in our biology and in our brains as language is. This is most obvious with babies, says Sandra Trehub at the University of Toronto, who also published a paper in the Nature Neuroscience special issue. For babies, music and speech are on a continuum. Mothers use musical speech to 'regulate infant emotional states,' Trehub says. Regardless of what language they speak, the voice all mothers use with babies is the same: something between speech and song. This kind of communication puts the baby in a trance-like state, which is probably not very surprising. The upshot, says Trehub, is we probably don't realize just how much of a necessity music is."]], "heads": {"i": "Are we genetically conditioned to like music?", "ii": "Music and language contrasted", "iii": "Maths and a child's musical ability", "iv": "Musical communication between humans and animals", "v": "Current research into human musical preferences", "vi": "Looking back at established views of music", "vii": "Are we the only musical creatures?", "viii": "Good parents share their appreciation of music"}, "ans": ["ii", "vi", "v", "vii", "i"]}];
const PARA=new Set(["Flood control in the USA", "Healthy buildings, productive people", "Homo ergaster", "Can a global database of fossils help us predict the future of biodiversity on Earth?", "Classical music over the centuries"]);
const SECS=10*60;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let cur=0,curQ=0;
const state=TESTS.map(t=>({ans:Array(t.ans.length).fill(''),done:false,left:SECS,run:false}));
let tick=null;

function bandFor(c,n){const r=c/n;return r>=.95?'9.0':r>=.85?'8.0':r>=.75?'7.0':r>=.6?'6.0':r>=.45?'5.0':r>=.3?'4.0':'3.5 or below'}
function unitOf(t){return PARA.has(t.title)?'Paragraph':'Section'}
function letters(t){return t.blocks.filter(b=>b[0]==='sec').map(b=>b[1])}

function buildSelect(){
  $('#testSel').innerHTML=TESTS.map((t,i)=>`<option value="${i}">Test ${i+1}: ${esc(t.title)}</option>`).join('');
}
function render(){
  const t=TESTS[cur],st=state[cur],L=letters(t),u=unitOf(t),romans=Object.keys(t.heads);
  $('#testSel').value=cur;
  // passage
  let h=`<h2 class="ptitle">${esc(t.title)}</h2>`;let qi=0,pending=null;
  t.blocks.forEach(([k,v])=>{
    if(k==='sub'){h+=`<p class="psub">${esc(v)}</p>`;return}
    if(k==='intro'){h+=`<p class="intro">${esc(v)}</p>`;return}
    if(k==='sec'){h+=`<div class="slot" id="slot${qi}" data-q="${qi}"><span class="qn">${qi+1}</span><span class="txt">Choose a heading for ${u} ${v}</span></div>`;pending=v;qi++;return}
    h+=`<p class="para">${pending?`<span class="L">${pending}</span>`:''}${esc(v)}</p>`;pending=null;
  });
  h+=`<div class="credit">Passage from Diyorbek's Reading &amp; Listening, used with permission · Compiled by @ieltswithkhmdv</div>`;
  $('#left').innerHTML=h;$('#left').scrollTop=0;
  // questions
  const opts=`<option value="">— choose a heading —</option>`+romans.map(r=>`<option value="${r}">${r}. ${esc(t.heads[r])}</option>`).join('');
  let q=`<div class="card"><div class="qhead">Questions 1–${t.ans.length}</div>
   <div class="instr">The reading passage has ${t.ans.length} ${u.toLowerCase()}s, A–${L[L.length-1]}.</div>
   <div class="instr">Choose the correct heading for each ${u.toLowerCase()} from the list of headings below.</div>
   <div class="instr">Choose the correct number, i–${romans[romans.length-1]}, for questions 1–${t.ans.length}.</div>
   <div class="headbox"><h4>List of Headings</h4>${romans.map(r=>`<div class="hrow" data-r="${r}"><b>${r}</b><span>${esc(t.heads[r])}</span></div>`).join('')}</div></div>
   <div class="card">${L.map((l,i)=>`<div class="qrow" id="qrow${i}"><span class="num">${i+1}</span><span class="lab">${u} ${l}</span><select data-q="${i}">${opts}</select></div>`).join('')}</div>
   <div class="actions"><button class="btn" id="resetBtn">Reset test</button><button class="btn ${st.done?'result':'primary'}" id="subBtn">${st.done?'My Result':'Submit answers'}</button></div>`;
  $('#right').innerHTML=q;$('#right').scrollTop=0;
  document.querySelectorAll('#right select').forEach(s=>{
    const i=+s.dataset.q;s.value=st.ans[i];
    s.addEventListener('change',()=>{st.ans[i]=s.value;curQ=i;refresh()});
    s.addEventListener('focus',()=>{curQ=i;refresh(false)});
  });
  document.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',()=>goQ(+s.dataset.q)));
  $('#subBtn').onclick=()=>st.done?showResult():submit();
  $('#resetBtn').onclick=resetTest;
  curQ=0;refresh();updTimer();
}
function refresh(){
  const t=TESTS[cur],st=state[cur];
  t.ans.forEach((a,i)=>{
    const slot=$('#slot'+i),row=$('#qrow'+i),sel=row.querySelector('select'),v=st.ans[i];
    slot.classList.toggle('filled',!!v);
    slot.querySelector('.txt').textContent=v?`${v}. ${t.heads[v]}`:`Choose a heading for ${unitOf(t)} ${letters(t)[i]}`;
    slot.classList.remove('ok','bad');row.classList.remove('ok','bad');
    slot.querySelector('.fix')?.remove();row.querySelector('.ans')?.remove();
    sel.disabled=st.done;
    if(st.done){const good=v===a;slot.classList.add(good?'ok':'bad');row.classList.add(good?'ok':'bad');
      if(!good){slot.insertAdjacentHTML('beforeend',`<span class="fix">✓ ${a}</span>`);row.insertAdjacentHTML('beforeend',`<div class="ans">Correct: ${a}. ${esc(t.heads[a])}</div>`)}}
    row.classList.toggle('cur',i===curQ);
  });
  const used=new Set(st.ans.filter(Boolean));
  document.querySelectorAll('.hrow').forEach(r=>r.classList.toggle('used',used.has(r.dataset.r)));
  const f=$('#foot');
  f.innerHTML=`<span class="lbl">Test ${cur+1} ·</span>`+t.ans.map((a,i)=>{let c='chip';if(st.done)c+=st.ans[i]===a?' ok':' bad';else if(st.ans[i])c+=' done';return `<button class="${c}" data-q="${i}">${i+1}</button>`}).join('')+`<span class="lbl" style="margin-left:auto">${st.ans.filter(Boolean).length}/${t.ans.length} answered</span>`;
  f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>goQ(+c.dataset.q));
}
function goQ(i){const t=TESTS[cur];curQ=Math.max(0,Math.min(t.ans.length-1,i));refresh();
  $('#slot'+curQ).scrollIntoView({behavior:'smooth',block:'center'});$('#qrow'+curQ).scrollIntoView({behavior:'smooth',block:'center'});
  const s=$('#qrow'+curQ+' select');if(!s.disabled)s.focus({preventScroll:true});}
function submit(){
  const st=state[cur],t=TESTS[cur],blank=st.ans.filter(a=>!a).length;
  if(blank&&!confirm(`You have ${blank} unanswered question(s). Submit anyway?`))return;
  st.done=true;st.run=false;stopTick();render();showResult();
}
function showResult(){
  const t=TESTS[cur],st=state[cur],L=letters(t);const c=t.ans.filter((a,i)=>st.ans[i]===a).length;
  $('#mbox').innerHTML=`<h3 style="margin:0">Test ${cur+1}: ${esc(t.title)}</h3>
  <div class="score"><div><b>${c}/${t.ans.length}</b>Correct</div><div><b>${Math.round(c/t.ans.length*100)}%</b>Score</div><div><b>${bandFor(c,t.ans.length)}</b>Band (est.)</div></div>
  <table class="rtab"><tr><th>Q</th><th>${unitOf(t)}</th><th>Your answer</th><th>Correct</th></tr>${t.ans.map((a,i)=>`<tr><td>${i+1}</td><td>${L[i]}</td><td class="${st.ans[i]===a?'y':'n'}">${st.ans[i]||'—'}</td><td>${a}</td></tr>`).join('')}</table>
  <p style="font-size:12px;color:var(--muted)">Band is a rough estimate from the percentage of correct answers on this one question type.</p>
  <div class="actions"><button class="btn" id="mClose">Review answers</button>${cur<TESTS.length-1?'<button class="btn primary" id="mNext">Next test ▶</button>':''}</div>`;
  $('#modal').classList.add('show');
  $('#mClose').onclick=()=>$('#modal').classList.remove('show');
  const n=$('#mNext');if(n)n.onclick=()=>{$('#modal').classList.remove('show');switchTest(cur+1)};
}
function resetTest(){if(!confirm('Clear your answers for this test?'))return;state[cur]={ans:Array(TESTS[cur].ans.length).fill(''),done:false,left:SECS,run:false};stopTick();render()}
function switchTest(i){if(i<0||i>=TESTS.length)return;stopTick();state[cur].run=false;cur=i;render()}
// timer
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updTimer(){const st=state[cur];$('#tShow').textContent=fmt(st.left);$('#tShow').classList.toggle('low',st.left<=60);$('#tPlay').textContent=st.run?'⏸':'⏵'}
function stopTick(){clearInterval(tick);tick=null}
$('#tPlay').onclick=()=>{const st=state[cur];if(st.done)return;st.run=!st.run;stopTick();
  if(st.run)tick=setInterval(()=>{st.left--;if(st.left<=0){st.left=0;st.run=false;stopTick();updTimer();alert("Time's up!");submit();return}updTimer()},1000);updTimer()};
$('#tReset').onclick=()=>{const st=state[cur];stopTick();st.run=false;st.left=SECS;updTimer()};
// nav
$('#testSel').onchange=e=>switchTest(+e.target.value);
$('#prevT').onclick=()=>switchTest(cur-1);$('#nextT').onclick=()=>switchTest(cur+1);
$('#prevQ').onclick=()=>goQ(curQ-1);$('#nextQ').onclick=()=>goQ(curQ+1);
// highlight
$('#hlBtn').onclick=()=>{const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);
  if(!$('#left').contains(r.commonAncestorContainer))return;
  try{const m=document.createElement('mark');r.surroundContents(m);m.title='Click to remove';}catch(e){alert('Please highlight within one paragraph at a time.')}s.removeAllRanges()};
$('#left').addEventListener('click',e=>{if(e.target.tagName==='MARK'){const m=e.target;m.replaceWith(...m.childNodes)}});
// dark mode
function setDark(d){document.body.classList.toggle('dark',d);$('#darkBtn').textContent=d?'☀️':'🌙';try{localStorage.setItem('mhDark',d?'1':'0')}catch(e){}}
$('#darkBtn').onclick=()=>setDark(!document.body.classList.contains('dark'));
try{setDark(localStorage.getItem('mhDark')==='1')}catch(e){}
// divider
(()=>{const d=$('#divider'),l=$('#left');let drag=false;
d.addEventListener('mousedown',()=>{drag=true;document.body.style.userSelect='none'});
window.addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect=''});
window.addEventListener('mousemove',e=>{if(!drag)return;const p=Math.min(80,Math.max(25,e.clientX/window.innerWidth*100));l.style.width=p+'%'})})();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
buildSelect();render();
</script>
<script src="../track.js"></script>
</body>
</html>
